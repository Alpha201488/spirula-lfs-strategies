# CUDA build for the Spirula strategy port (IGS+ / MRNF / MCMC).
#
# The sandbox that produced this port has no CUDA toolchain, so the Linux
# CUDA binary is built here on GitHub-hosted runners, in an NVIDIA CUDA dev
# container (the same approach LichtFeld Studio uses; see the LFS fork's
# .github/workflows/ubuntu.yml for the original).
#
# Pitfalls avoided (all learned the hard way upstream):
#   * GitHub runners have no NVIDIA GPU inside the container, and Spirula's
#     CMake queries nvidia-smi for the target architecture -- without an
#     explicit TORCH_CUDA_ARCH_LIST the configure step fails with
#     "Could not detect a CUDA GPU".
#   * The runner container has no GUI libs; build with SS_BUILD_GUI=OFF to
#     skip the glfw/imgui/OpenGL fetch-and-build entirely (the CLI trains,
#     evaluates and exports; the GUI can be built locally with
#     -DSS_BUILD_GUI=ON).
#   * Keep the tree's generated files current: the lint job runs the codegen
#     scripts and `git diff --exit-code`, so the commit must contain exactly
#     what tools/codegen produces.

name: build-cuda

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-linux:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.0-devel-ubuntu24.04
    env:
      # RTX 50-series (Blackwell, sm_120) is the port's primary target; the
      # 8.9 arch keeps the artifact runnable on 40-series cards too.
      TORCH_CUDA_ARCH_LIST: "8.9;12.0"
      CMAKE_BUILD_TYPE: Release
    steps:
      - name: Install Git
        run: apt-get update && apt-get install -y git

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -rf /usr/local/cuda/nsight* /usr/local/cuda/compute-sanitizer \
                 /usr/local/cuda/extras /usr/local/cuda/tools /usr/local/cuda/doc
          find /usr/local/cuda/targets/x86_64-linux/lib -name '*.a' \
            ! -name 'libcudart_static.a' ! -name 'libcudadevrt.a' \
            ! -name 'libculibos.a' -delete 2>/dev/null || true

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build pkg-config ccache

      - name: Restore ccache
        # Every push lands on a fresh runner, so without a compiler cache each
        # run recompiles the whole tree (~2.5h on Windows). ccache persists
        # object hashes across runs; only files that actually changed rebuild.
        # Fixed key (not sha-based): the concurrency group guarantees a single
        # build per branch, so the entry is simply refreshed each run instead
        # of accumulating many near-identical cache entries.
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-linux-${{ runner.arch }}-cuda13
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          ccache --set-config=max_size=6G
          ccache --set-config=compression=true
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DSS_BUILD_GUI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DTORCH_CUDA_ARCH_LIST="${{ env.TORCH_CUDA_ARCH_LIST }}"

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Smoke test
        run: ./build/spirula train --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spirula-strategy-port-linux-cuda
          path: build/spirula
          retention-days: 30

  # Native Windows CUDA build. build_develop.bat locates VS (vcvars64),
  # picks Ninja and auto-detects the CUDA toolkit under
  # "Program Files\NVIDIA GPU Computing Toolkit\CUDA\v*", which is exactly
  # where the cuda-toolkit action installs it.
  cuda-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          # CUDA 13 ships MSVC support current enough for windows-2025's VS;
          # 12.8 crashed nvcc (cudafe++ ACCESS_VIOLATION) on its headers.
          # Full install: the nvcc+cudart sub-packages missed crt/host_config.h.
          cuda: '13.2.0'

      - name: Vulkan SDK
        # The GUI builds the SfM Geometry panel, whose VkContext.h includes
        # <vulkan/vulkan.h>; without the SDK the GUI build fails with C1083.
        # Same pinned version and silent-install the upstream Vulkan CI uses.
        shell: pwsh
        run: |
          curl.exe -sSL -o vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan_sdk.exe
          $p = Start-Process -FilePath .\vulkan_sdk.exe -NoNewWindow -Wait -PassThru `
               -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV

      - name: Install ccache
        # MSVC+nvcc support landed in ccache 4.x; 4.10.2 is a pinned, known
        # good Windows release. nvcc shells out to cl.exe, so cache hits are
        # partial, but the GUI's C++ bulk (imgui/glfw/app code) hits hard.
        shell: pwsh
        run: |
          curl.exe -sSL -o ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          Expand-Archive -Force ccache.zip -DestinationPath C:\ccache
          "C:\ccache\ccache-4.10.2-windows-x86_64" >> $env:GITHUB_PATH
          ccache --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\ccache
          key: ccache-windows-${{ runner.arch }}-cuda13
          restore-keys: ccache-windows-

      - name: Build
        shell: cmd
        # GUI builds the GLFW/ImGui window app (SS_BUILD_GUI defaults to ON).
        # The GUI panels unconditionally pull SfM (GeometryPanel -> sfm/vk/
        # VkContext.h -> vulkan.h) and the SAM/segmentation stack (DatasetPrep,
        # SegmentPanel -> nn/ + sam/), so the CUDA build must opt both in
        # (default OFF under SS_BACKEND=cuda); slangc is auto-fetched by
        # ss_find_slangc when missing.
        run: |
          ccache --set-config=max_size=8G
          ccache --set-config=compression=true
          build_develop.bat -DSS_BUILD_SFM=ON -DSS_BUILD_SAM=ON -DTORCH_CUDA_ARCH_LIST=8.9;12.0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Smoke
        shell: cmd
        run: build\spirula.exe train --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spirula-strategy-port-windows-cuda
          path: |
            build/spirula.exe
            build/spirula.map
          retention-days: 30
